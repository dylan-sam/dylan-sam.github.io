# Canonical route registry. Navigation, language switching, legacy redirects
# and llms.txt all read their URLs from this file.
home:
  label_key: home
  urls:
    fr: /
    en: /en/
  navigation_urls:
    fr: /#home
    en: /en/#home
publications:
  label_key: publications
  urls:
    fr: /publications/
    en: /en/publications/
  navigation_urls:
    fr: /#publications
    en: /en/#publications
  redirect_urls:
    fr: /#publications
    en: /en/#publications
awards:
  label_key: awards
  urls:
    fr: /awards/
    en: /en/awards/
  navigation_urls:
    fr: /#awards
    en: /en/#awards
  redirect_urls:
    fr: /#awards
    en: /en/#awards
notes:
  label_key: notes
  urls:
    fr: /notes/
    en: /en/notes/
music:
  label_key: music_dance
  urls:
    fr: /music-dance/
    en: /en/music-dance/
