{% comment %}Preserve the former ?lang= query-string language selector.{% endcomment %}
<script>
    (() => {
        const params = new URLSearchParams(window.location.search);
        if (!params.has('lang')) return;

        const home = params.get('lang') === 'en'
            ? {{ site.data.routes.home.urls.en | relative_url | jsonify }}
            : {{ site.data.routes.home.urls.fr | relative_url | jsonify }};
        window.location.replace(home + window.location.hash);
    })();
</script>
